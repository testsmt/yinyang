name: ci

on: [push, pull_request]

jobs:
  # Fast checks of yinyang's own code on every supported Python version.
  quick:
    name: quick (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install codespell flake8
        python -m pip install antlr4-python3-runtime==4.9.2
        python -m pip install ffg
    - name: Spell check
      run: |
        codespell --skip="Solver.py,SMTLIBv2*,*.g4,*.tokens,*.interp,*.smt2"
    - name: code style and static analysis with flake
      run: |
        bin/checkstyle.sh
    - name: Run Unittests
      run: |
        python -m unittest tests/RunUnitTests.py
    - name: Detection logic
      run: |
        python tests/integration/detection/TestDetection.py
        python tests/integration/detection/TestCrashes.py
    - name: Misc
      run: |
        python tests/integration/misc/FileSizeLimit.py
        python tests/integration/misc/NoSolvers.py

  # Integration tests with real solvers. Their run time goes into
  # downloading, building and running solvers, which does not depend on the
  # Python version, so they run on one version only.
  integration:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    # setuptools provides distutils, which Python 3.12+ no longer ships and
    # z3's build scripts (SanityTypeFuzz.py) still import.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install setuptools
        python -m pip install antlr4-python3-runtime==4.9.2
        python -m pip install ffg
    # SanityTypeFuzz.py builds z3 from source (about 9 minutes) and keeps
    # the binary in ~/.cache/yinyang-ci, so cache that directory.
    - name: Cache solvers built from source
      uses: actions/cache@v4
      with:
        path: ~/.cache/yinyang-ci
        key: solvers-ubuntu-22.04-z3-d0515dc
    - name: Misc
      run: |
        python tests/integration/misc/DirectoryMode.py
    - name: semanticfusion
      run: |
        python tests/integration/semanticfusion/SanitySemanticFusion.py
    - name: typefuzz
      run: |
        python tests/integration/typefuzz/SanityTypeFuzz.py
        python tests/integration/typefuzz/BasicUsage.py
    - name: opfuzz
      run: |
        python tests/integration/opfuzz/SanityOpFuzz.py
        python tests/integration/misc/Usage.py
    - name: regression
      run: |
        python tests/regression/issue42.py
        cd tests/regression && python scoping_bug.py
    - name: pypi check
      run: |
        tests/integration/misc/pypi.sh
